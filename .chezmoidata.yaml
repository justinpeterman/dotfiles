# Registry of apps deployed to this server. run_onchange_after_server-apps.sh.tmpl
# loops over this list to scaffold each app's on-disk layout (releases/, shared/,
# activate-release.sh, ecosystem.config.js). Adding an app = append a block here and
# `chezmoi apply` — no new source files needed.
#
# All values here are NON-SECRET (they end up in a public repo). Real secrets go in
# each app's shared/.env on the server, which the scaffold creates 600 and never
# overwrites. Fields:
#   name       unique app id; also the ~/apps/<name> dir and PM2 process name
#   port       unique localhost port the app listens on (Cloudflare Tunnel targets it)
#   entrypoint built JS entry PM2 runs, relative to the release dir (e.g. dist/index.js)
#   hostname   public hostname routed to this app via Cloudflare Tunnel

# Name of the Cloudflare Tunnel that fronts this server (created once with
# `cloudflared tunnel create <name>`). run_onchange_after_cloudflared-tunnel-server.sh
# regenerates that tunnel's ingress + DNS routes from the apps list below.
cloudflare_tunnel: mac-mini

# OPTIONAL simple local backups (run_onchange_after_backups-server.sh.tmpl). Off by
# default — flip to true to install a daily launchd agent that copies each app's
# SQLite db + shared/.env + uploads into ~/backups/<app>/ (last 7 kept). Local only,
# unencrypted; fine for hobby data on this single box. Revisit if data gets sensitive.
backups_enabled: false

apps:
  - name: daybreaker
    port: 3001
    entrypoint: dist/index.js
    hostname: daybreaker.justinpeterman.com
