# ~/.config/tmux/tmux.conf (chezmoi source: dot_config/tmux/tmux.conf)
#
# Colors are the ANSI palette (colour0-15) rather than hex on purpose: tmux
# resolves them through the iTerm2 profile, so this bar matches "Justin's
# Defaults" today and follows any future palette change there.
#
# ORDERING IS LOAD-BEARING. Most `set`s belong before `run tpm` at the bottom,
# because tmux-sensible skips any option that no longer holds tmux's
# compiled-in default — that is what protects display-time and status-interval.
# status-keys is the exception: sensible sets it to emacs unconditionally, with
# no guard, so it has to be re-asserted after tpm (see the bottom of this file).

# ---- initial setup ----------------------------------------------------------
set -g default-terminal xterm-256color
# Truecolor/italics passthrough; keys off the OUTER terminal's TERM (iTerm2).
set -as terminal-features ",xterm-256color:RGB"
set -g base-index 1
set-window-option -g pane-base-index 1

# ---- panes ------------------------------------------------------------------
# Alt-arrow to switch panes, no prefix.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Easier splits.
bind-key v split-window -h
bind-key h split-window -v

# ---- windows ----------------------------------------------------------------
# Shift-arrow to switch windows.
bind -n S-Left  previous-window
bind -n S-Right next-window

set-window-option -g automatic-rename on
set-option -g set-titles on

# Highlight the tab on activity, and don't clear it when activity stops.
setw -g monitor-activity on
setw -g monitor-silence 0
setw -g monitor-bell off
set -g visual-activity off

# ---- behaviour --------------------------------------------------------------
set -g mouse on
set-option -g display-time 3000
set-option -g display-panes-time 3000
# Let the arrow keys work immediately after changing windows.
set-option -g repeat-time 0

# Reload. Targets the XDG path, not ~/.tmux.conf — the config lives here, so
# sourcing ~/.tmux.conf would silently reload nothing.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# ---- status bar -------------------------------------------------------------
# 60s is the only timer in the system. Claude pushes an immediate
# `refresh-client -S` from its statusline when its numbers actually change, so
# this interval only has to cover Codex, which has no hook.
set -g status-interval 60
set -g status-left-length 60
set -g status-right-length 250

set -g status-style "fg=colour12,bg=colour0"
set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[fg=colour6,bold] #I:#W #[fg=colour12,nobold]"
set -g window-status-activity-style "fg=colour3"
set -g pane-border-style        "fg=colour0"
set -g pane-active-border-style "fg=colour6"
set -g message-style "fg=colour14,bg=colour0"
set -g mode-style    "fg=colour14,bg=colour8,reverse"

# Left: cwd + git branch. Right: Claude/Codex context and usage meters, which
# render only while those agents actually occupy a pane of this session.
set -g status-left  "#(~/.config/tmux/status.py left '#{pane_current_path}')"
set -g status-right "#(~/.config/tmux/status.py right '#{session_name}' '#{pane_id}' '#{client_width}')"

# ---- plugins ----------------------------------------------------------------
# Installed under the XDG path rather than ~/.tmux/; see
# run_onchange_after_tmux-tpm.sh, which clones TPM and installs these.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.config/tmux/plugins/tpm/tpm'

# ---- overrides that must outlive the plugins --------------------------------
# tmux-sensible runs `set -g status-keys emacs` with no guard, so unlike every
# other option here it cannot be protected by setting it earlier. Re-assert it.
set -g status-keys vi
